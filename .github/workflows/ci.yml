name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  STORYBOOK_DISABLE_TELEMETRY: 1
  TURBO_TELEMETRY_DISABLED: 1
  TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
  TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  TURBO_FORCE: ${{ github.event_name == 'schedule' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # fallow audit diffs against the PR's base branch, so it needs history.
          fetch-depth: 0
          filter: blob:none
      # Reads the pnpm version from package.json's packageManager field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-node26-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-node26-${{ github.ref }}-
            turbo-${{ runner.os }}-node26-refs/heads/main-
      - name: Select safe affected tasks
        id: scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          # Unknown/root inputs must execute everything, not reuse a possibly stale task hash.
          changed=$(git diff --name-only "$TURBO_SCM_BASE" "$TURBO_SCM_HEAD")
          if grep -qvE '^(apps/(web|gateway|storybook)|packages/(catalog|config|runtime|ui))/' <<< "$changed"; then
            echo 'TURBO_FORCE=true' >> "$GITHUB_ENV"
          else
            echo 'args=--affected' >> "$GITHUB_OUTPUT"
          fi

      - name: Format
        run: pnpm format:check
      - name: Verify CI scope safety
        run: node --test scripts/ci-scope.test.js
      - name: Lint
        run: pnpm lint --format github
      - name: Typecheck
        run: pnpm typecheck ${{ steps.scope.outputs.args }}
      - name: Gateway tests with coverage
        run: pnpm --filter gateway test:coverage

      - name: Read Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter storybook exec playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ steps.playwright.outputs.version }}
      - name: Install Chromium for story tests
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter storybook exec playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter storybook exec playwright install-deps chromium
      - name: Browser journey with source-mapped coverage
        shell: bash
        run: |
          VITE_AUTH=none pnpm --filter web exec react-router build --sourcemapClient hidden --minify false
          node apps/web/scripts/simulation-ui-server.mjs > /tmp/sierra-ui.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          curl --retry 30 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:8790/__qa > /dev/null
          node apps/web/scripts/simulation-runs-check.mjs \
            --out .amp/tmp/ci-journey/screenshots --logs .amp/tmp/ci-journey/logs \
            --coverage coverage/coverage-final.json
      - name: Fallow audit (findings this PR introduces)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: >-
          pnpm fallow audit --base "origin/$BASE_REF"
          --coverage coverage/coverage-final.json --format github-annotations
      - name: Unit and story tests
        run: pnpm test --filter='!gateway' ${{ steps.scope.outputs.args }}
      - name: Build
        run: pnpm build
      - name: Build Storybook
        run: pnpm build-storybook

      - name: Upload failed-story screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-story-screenshots
          path: apps/storybook/**/__screenshots__/
          if-no-files-found: ignore
      - name: Upload browser journey evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-journey-evidence
          path: |
            .amp/tmp/ci-journey/
            /tmp/sierra-ui.log
            coverage/coverage-final.json
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Upload Storybook
        uses: actions/upload-artifact@v7
        with:
          name: storybook-static
          path: apps/storybook/storybook-static/
